#   uv pip compile backend/requirements.txt --python-version 3.12 \
#       --output-file backend/requirements.lock
#
# Install with:
#   uv venv --python 3.12 backend/.venv
#   uv pip install --python backend/.venv/bin/python -r backend/requirements.lock
#
# The scikit-learn / xgboost / numpy pins below match
# alloy_crew/models/saved_models_v2/train_env.json exactly. Model metrics are
# sensitive to those three (v1 YS cv_MAE is 92.28 on sklearn 1.7.2 but 98.01 on
